[project]
name = "Veyronix-backend"
version = "0.1.0"
description = "Veyronix - "
requires-python = ">=3.11,<3.13"
license = { text = "AGPL-3.0" }
authors = [
    { name = "Veyronix Team" }
]

dependencies = [
    # Web framework
    "flask>=3.0.0",
    "flask-cors>=6.0.0",
    
    # LLM provider
    "openai>=1.0.0",
    
    # HTTP client
    "httpx>=0.27.0",
    
    # Document parsing
    "PyMuPDF>=1.24.0",
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",
    
    # Configuration and validation
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",

    # Production WSGI server (Linux)
    "gunicorn>=21.2.0; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pipreqs>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
